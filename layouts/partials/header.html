<header class="site-header">
  <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
  <nav class="site-nav">
    {{ $currentPage := . }}
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}"{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }} class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
